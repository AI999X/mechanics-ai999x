[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanics-ai999x"
version = "1.0.1"
description = "Offline classical-mechanics solver: damped, driven and coupled oscillations, pendulums, orbits, moments of inertia, rolling, Atwood machines, precession, rotating frames, collisions and rockets, with steps, LaTeX and honest refusals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ibnul Jaif Farabi"}]
maintainers = [{name = "AI999X"}]
keywords = ["classical mechanics", "mechanics", "physics", "damped oscillator", "driven oscillator", "normal modes", "double pendulum", "orbital mechanics", "vis-viva", "escape velocity", "kepler", "moment of inertia", "rolling motion", "atwood machine", "precession", "foucault pendulum", "elastic collision", "rocket equation", "ai999x", "offline", "cpu", "stem", "education", "step-by-step", "latex", "solver"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Intended Audience :: Developers", "Topic :: Scientific/Engineering", "Topic :: Education", "Development Status :: 5 - Production/Stable"]
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.scripts]
mechanics-ai999x = "mechanics_ai999x.cli:main"

[project.urls]
"Source" = "https://github.com/AI999X/mechanics-ai999x"
"Issues" = "https://github.com/AI999X/mechanics-ai999x/issues"
"Homepage" = "https://ai999x.com"
"Hugging Face" = "https://huggingface.co/AI999X/mechanics-ai999x"
"Funding" = "https://buymeacoffee.com/ibnuljaiffarabi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanics_ai999x = ["pack/*.json", "pack/*/*.json", "pack/*.sqlite", "pack/capabilities/*.py"]
